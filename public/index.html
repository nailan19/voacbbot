<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocabulary Coach</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Vocabulary Coach</h1>
    <p class="subtitle">Look up a word to learn its definitions, collocations, and example sentences.</p>
  </header>

  <main>
    <div id="demo-banner" class="demo-banner" hidden></div>

    <form id="search-form" class="search-bar">
      <input
        id="word-input"
        type="text"
        placeholder="Type a word, e.g. resilient"
        autocomplete="off"
        autofocus
      />
      <button type="submit" id="search-btn">Look up</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="results" class="results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
